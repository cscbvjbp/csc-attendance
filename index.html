<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSC Staff Attendance</title>
<meta name="theme-color" content="#A223EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <img class="logo" alt="CSC Bal Vidyalaya logo" src="logo.jpg">
    <div class="brand"><b>CSC Bal Vidyalaya</b><span>Staff Attendance</span></div>
    <div class="who" id="who" hidden><span class="nm" id="whoName"></span><button type="button" id="signOut">Sign out</button></div>
  </div>
</header>

<main class="wrap" id="main">
  <div id="block" class="narrow" hidden>
    <div class="card stack"><h2 id="blockTitle">Setup is not finished</h2><p id="blockText"></p></div>
  </div>

  <p id="loading" class="loading">Loading…</p>

  <section id="login" class="narrow" hidden>
    <div class="shield">
      <img class="crest" alt="" src="logo.jpg">
      <h1>Sign in</h1>
      <p class="lead" id="lLead">Use the Staff ID and PIN given by the school office.</p>
      <div style="display:flex;justify-content:center;margin:0 0 16px"><div class="seg" role="group" aria-label="Sign in as"><button type="button" data-lt="staff" aria-pressed="true">Staff</button><button type="button" data-lt="admin" aria-pressed="false">Admin</button></div></div>
      <form id="loginForm" class="stack" autocomplete="on">
        <div><label for="lid">Staff ID</label><input id="lid" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="e.g. CSC001" required></div>
        <div><label for="lpin">PIN</label><input id="lpin" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="6 digits" required></div>
        <button class="btn" type="submit" id="lgo">Sign in</button>
        <p class="err" id="lerr" role="alert"></p>
      </form>
      <form id="adminForm" class="stack" autocomplete="on" hidden>
        <div><label for="aid">Admin ID</label><input id="aid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="admin" required></div>
        <div><label for="apw">Password</label><input id="apw" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn" type="submit" id="ago">Sign in as admin</button>
        <p class="err" id="aerr" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="shell" hidden>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div id="view"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
